# Render Blueprint — статик вэб сайт (build хийх шаардлагагүй)
services:
  - type: web
    name: matematik-ajlyn-khuudas
    runtime: static
    buildCommand: echo "Build шаардлагагүй"
    staticPublishPath: .
    headers:
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
